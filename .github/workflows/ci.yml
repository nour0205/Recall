name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (offline, no API key)
        run: python -m unittest discover -s tests
      - name: Benchmark schemas
        run: python -m evaluation.validate_benchmark
      - name: Reproduce saved evaluation scores
        run: python -m evaluation.verify_saved_results

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recall-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: recall-frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t recall-backend .
      - name: Build frontend image
        run: docker build -t recall-frontend ./recall-frontend
